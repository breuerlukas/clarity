name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compiles and looks for bugs and security patterns (SpotBugs with
  # FindSecBugs) before the tests run; any finding fails the build. The style
  # is checked on every commit by the Lint workflow.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Analyze and test
        run: ./gradlew build -x checkstyleMain -x checkstyleTest

      # Pull requests from forks get no write access to code scanning.
      - name: Upload the SpotBugs report
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: api/build/reports/spotbugs/main.sarif
          category: spotbugs

  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - run: npm ci
      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build

  # Publishes the images the server pulls on a timer (docs/server.md). Only
  # on a push to main, never for a pull request, so only what landed on main
  # gets deployed. The images hold no secrets: config.ini, the Enable Banking
  # key and the mailbox key come from .env and volumes on the server.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, panel]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        part: [api, panel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.part }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.part }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.part }}:sha-${{ github.sha }}
