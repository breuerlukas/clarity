version: 2
updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: npm
    directory: /panel
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  - package-ecosystem: docker
    directories: [ /api, /panel ]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
